name: Bug 报告
description: 报告可复现的问题；不要附账号、数据库或令牌。
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 提交或版本、Node.js、部署方式，以及相关安卓版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 删除密码、Cookie、令牌、个人书目和服务器私密信息。
