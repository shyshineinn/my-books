<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>My books · 图书记录</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <!-- iOS 添加到主屏幕的支持(Safari 不读 manifest 的部分用 meta 补齐) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My books">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=96">
</head>
<!-- 多页拆分:顶栏/弹窗/菜单/页脚由 js/chrome.js 注入(body[data-page] 决定导航高亮),
     页面 HTML 只写自己的 <main>。脚本一律 defer,加载顺序 chrome → common → 页面脚本。 -->
<body data-page="home">
  <main class="page-home">
    <div id="homeContent"></div>
  </main>

  <script defer src="/js/chrome.js?v=29"></script>
  <script defer src="/js/common.js?v=18"></script>
  <script defer src="/js/scanner.js?v=2"></script>
  <script defer src="/js/endless-gallery.js?v=19"></script>
  <script defer src="/js/page-home.js?v=2"></script>
</body>
</html>
