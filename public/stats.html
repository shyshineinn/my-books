<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>统计 · My books</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My books">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=90">
</head>
<body data-page="stats">
  <main>
    <h1 class="page-title">统计</h1>
    <div id="statsHero" class="stats-hero"></div>
    <div class="stats-panels">
      <div class="panel panel-wide is-collapsed" id="yearPanel">
        <h3>每年读完</h3>
        <div id="yearChart" class="chart"></div>
      </div>
      <div class="panel panel-wide is-collapsed" id="tagPanel">
        <h3>标签分布</h3>
        <div id="tagCloud" class="tag-cloud"></div>
      </div>
      <div class="panel is-collapsed" id="authorPanel">
        <h3>作者<span id="authorTotal" class="panel-sub"></span></h3>
        <div id="authorRank" class="stat-rank-list"></div>
      </div>
      <div class="panel is-collapsed" id="publisherPanel">
        <h3>出版社<span id="publisherTotal" class="panel-sub"></span></h3>
        <div id="publisherRank" class="stat-rank-list"></div>
      </div>
    </div>
  </main>

  <script defer src="/js/chrome.js?v=28"></script>
  <script defer src="/js/common.js?v=18"></script>
  <script defer src="/js/scanner.js?v=2"></script>
  <script defer src="/js/page-stats.js?v=4"></script>
</body>
</html>
