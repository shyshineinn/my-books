<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<body data-page="stats">

    <h1 class="page-title">统计</h1>

      </div>
      <div class="panel">
        <h3>标签分布</h3>
        <div id="tagCloud" class="tag-cloud"></div>
      </div>
    </div>
  </main>

  <script defer src="/js/chrome.js?v=5"></script>
  <script defer src="/js/common.js?v=6"></script>
