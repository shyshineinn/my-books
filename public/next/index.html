<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的书房</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">我的书房</span>
    </a>

    <nav class="tabs" id="tabs" role="tablist" aria-label="状态筛选">
      <button class="tab is-active" data-status="" role="tab">全部</button>
      <button class="tab" data-status="reading" role="tab">在读</button>
      <button class="tab" data-status="done" role="tab">已读</button>
      <button class="tab" data-status="wish" role="tab">想读</button>
    </nav>

    <div class="topbar-right">
      <form class="search" id="search-form" role="search">
        <input id="search-input" type="search" placeholder="搜索书名、作者…" autocomplete="off" aria-label="搜索">
      </form>
      <a class="icon-btn" href="#/stats" title="统计" aria-label="统计">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 20h3v-8H4v8Zm6.5 0h3V4h-3v16Zm6.5 0h3v-12h-3v12Z"/></svg>
      </a>
    </div>
  </div>
</header>

<main id="view" class="view" aria-live="polite">
  <div class="loading">加载中…</div>
</main>

<!-- 书籍详情 + 阅读记录编辑 -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="书籍详情"></aside>

<script type="module" src="app.js"></script>
</body>
</html>
