<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>读书心得 · My books</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My books">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=90">
</head>
<!-- 读书心得独立成页(/notes/:id):Markdown 渲染库只在这里加载 -->
<body data-page="notes">
  <main>
    <div class="notes-page-head">
      <button type="button" id="notesBack" class="btn btn-ghost">返回</button>
      <div class="notes-book">
        <div class="notes-book-cover" id="notesCover"></div>
        <div class="notes-book-info">
          <h1 id="notesTitle"></h1>
          <div class="notes-book-meta" id="notesMeta"></div>
        </div>
      </div>
    </div>
    <div class="notes-page-body" id="notesPageBody"></div>
  </main>

  <script defer src="/js/chrome.js?v=28"></script>
  <script defer src="/js/common.js?v=18"></script>
  <script defer src="/js/scanner.js?v=2"></script>
  <script defer src="/vendor/marked.umd.js"></script>
  <script defer src="/vendor/purify.min.js"></script>
  <script defer src="/js/page-notes.js?v=1"></script>
</body>
</html>
