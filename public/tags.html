<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafafc">
  <title>分类 · My books</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My books">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=36">
</head>
<body data-page="tags">
  <main>
    <h1 class="page-title">分类管理</h1>
    <p class="page-sub">整理标签与作者。重命名会同步到所有书籍,合并用于归并同义词,删除只解除分类(书本身保留)。点名称可在书架中筛选。</p>
    <div class="cats">
      <section class="cat-col" aria-labelledby="tagsHead">
        <header class="cat-head"><h2 id="tagsHead">标签</h2><span class="cat-count" id="tagsCount"></span></header>
        <div class="cat-list" id="tagsList"></div>
      </section>
      <section class="cat-col" aria-labelledby="authorsHead">
        <header class="cat-head"><h2 id="authorsHead">作者</h2><span class="cat-count" id="authorsCount"></span></header>
        <div class="cat-list" id="authorsList"></div>
      </section>
    </div>
  </main>

  <!-- 合并弹窗(本页专属;静态存在,common.js 的通用关闭逻辑一并接管) -->
  <div id="mergeModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box settings-box">
      <div class="modal-head">
        <h2 id="mergeTitle">合并分类</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">✕</button>
      </div>
      <div class="form-grid">
        <div class="field field-full">
          <p class="merge-desc" id="mergeDesc"></p>
          <label for="mergeTarget">合并到</label>
          <select id="mergeTarget" aria-label="合并目标"></select>
        </div>
      </div>
      <div class="form-foot">
        <span id="mergeError" class="form-error"></span>
        <div class="form-foot-btns">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="button" class="btn btn-primary" id="mergeConfirm">合并</button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="/js/chrome.js?v=3"></script>
  <script defer src="/js/common.js?v=2"></script>
  <script defer src="/js/page-tags.js?v=1"></script>
</body>
</html>
