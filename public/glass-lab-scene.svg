<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Glass Lab 高对比度测试背景：彩色网格、条纹与书脊">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a3a"/>
      <stop offset="0.42" stop-color="#123f74"/>
      <stop offset="0.72" stop-color="#7a1f5c"/>
      <stop offset="1" stop-color="#e04f2f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.33" stop-color="#ffcc00"/>
      <stop offset="0.66" stop-color="#34c759"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <pattern id="microgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <pattern id="checker" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#0b0b0d"/>
      <rect width="40" height="40" fill="#f7f7f7"/>
      <rect x="40" y="40" width="40" height="40" fill="#f7f7f7"/>
    </pattern>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="44" height="44" fill="#00d5ff"/>
      <rect width="22" height="44" fill="#001b2e"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1280" cy="190" r="210" fill="url(#sun)"/>
  <circle cx="1280" cy="190" r="164" fill="none" stroke="#0b0b0d" stroke-opacity="0.55" stroke-width="10"/>

  <g transform="rotate(-12 300 760)">
    <rect x="-120" y="520" width="780" height="300" fill="url(#checker)"/>
  </g>
  <g transform="rotate(8 1180 800)">
    <rect x="900" y="560" width="720" height="330" fill="url(#stripes)"/>
  </g>

  <rect x="120" y="130" width="520" height="300" rx="28" fill="url(#prism)" opacity="0.94"/>
  <rect x="120" y="130" width="520" height="300" rx="28" fill="url(#microgrid)"/>
  <path d="M180 390 L340 180 L500 390 Z" fill="#f7f7f7" opacity="0.9"/>
  <path d="M320 390 L430 230 L560 390 Z" fill="#0b0b0d" opacity="0.82"/>

  <g stroke="#ffffff" stroke-opacity="0.62" stroke-width="2">
    <path d="M80 0V1000M240 0V1000M400 0V1000M560 0V1000M720 0V1000M880 0V1000M1040 0V1000M1200 0V1000M1360 0V1000M1520 0V1000"/>
    <path d="M0 120H1600M0 280H1600M0 440H1600M0 600H1600M0 760H1600M0 920H1600"/>
  </g>

  <g transform="translate(640 640)">
    <rect x="0" y="0" width="86" height="300" rx="8" fill="#f7f7f7"/>
    <rect x="98" y="-30" width="86" height="330" rx="8" fill="#ff2d55"/>
    <rect x="196" y="20" width="86" height="280" rx="8" fill="#0a84ff"/>
    <rect x="294" y="-8" width="86" height="308" rx="8" fill="#ffcc00"/>
    <rect x="392" y="42" width="86" height="258" rx="8" fill="#0b0b0d"/>
    <g fill="#0b0b0d" opacity="0.72">
      <rect x="18" y="34" width="50" height="6" rx="3"/>
      <rect x="18" y="52" width="34" height="6" rx="3"/>
      <rect x="214" y="48" width="50" height="6" rx="3"/>
      <rect x="312" y="26" width="50" height="6" rx="3"/>
    </g>
  </g>

  <g fill="#f7f7f7">
    <rect x="1020" y="380" width="410" height="14" rx="7"/>
    <rect x="1020" y="412" width="320" height="14" rx="7"/>
    <rect x="1020" y="444" width="370" height="14" rx="7"/>
  </g>
  <circle cx="1090" cy="540" r="46" fill="none" stroke="#f7f7f7" stroke-width="8"/>
  <circle cx="1200" cy="540" r="46" fill="none" stroke="#ffcc00" stroke-width="8"/>
  <circle cx="1310" cy="540" r="46" fill="none" stroke="#00d5ff" stroke-width="8"/>
</svg>
