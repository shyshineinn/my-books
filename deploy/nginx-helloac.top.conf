# ============================================================
# My books · helloac.top(根域名)
# 部署路径:/etc/nginx/conf.d/helloac.top.conf
# 反代目标:127.0.0.1:3002(PM2 进程名 my-books)
# 证书:云厂商免费证书(下载 Nginx 版后放进 /etc/nginx/ssl/helloac.top/)
#
# ⚠️ 生效前务必先做(2026-09-17 按服务器实测修正):
#   1) 让 Ubuntu 默认站点退出 —— 它当前占着 80 端口、root 指向 /home/ecook/website-books
#      (旧的静态「我的读书清单」页),而且 conf.d/ 本来是空的:
#        sudo mv /etc/nginx/sites-enabled/default /root/
#   2) 同批把 ecook 的配置也装上(新建文件见 deploy/nginx-ecook.helloac.top.conf),
#      两个文件都就位后再一次性 reload,避免中间出现「根域名无人接管」的窗口;
#   3) sudo nginx -t && sudo systemctl reload nginx
#
# 证书就位前**不要** reload 这份配置:`nginx -t` 会因为找不到证书文件而失败。
# (服务器上 /etc/nginx/ssl/ 实测为空,没有可临时顶替的自签证书 —— 所以必须先完成
#  阶段 6 的证书上传,再做本阶段的切换。)
# ============================================================

# ---------- HTTP:只留 ACME 校验路径,其余 301 跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    # 80 端口带上 www:让 http://www.helloac.top 也能 301 到主域名(不需要证书)
    server_name helloac.top www.helloac.top;

    # 保留证书校验目录(以后若改用 Let's Encrypt 自动续期可直接复用)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # 固定 301 到 https://helloac.top(不能写 $host):
    # 免费证书是单域名、不覆盖 www,若跳成 https://www.helloac.top,443 上没有匹配的
    # server 块,会落到别的站点并报证书不匹配。这里把 www 一并汇到主域名。
    location / {
        return 301 https://helloac.top$request_uri;
    }
}

# ---------- HTTPS:正式站点 ----------
server {
    # 兼容写法:本机 Nginx 实测为 1.24.0,不支持 `http2 on;` 这条新指令
    # (1.25.1+ 才是 `listen 443 ssl;` + `http2 on;`)。用下面这种写法新旧版本都能过。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name helloac.top;

    # —— 云厂商免费证书(腾讯云/阿里云下载的「Nginx 版」:一个 .crt + 一个 .key)——
    # 免费证书是单域名,不覆盖 www,所以这里 443 只服务 helloac.top 本身;
    # http://www.helloac.top 会在 80 端口那个 server 块里 301 到 https://helloac.top。
    # 若确实要 https://www.helloac.top 也能打开,需再申请一张 www 的证书并加一个 server 块。
    # 腾讯云下载包名通常形如 helloac.top_bundle.crt / helloac.top.key,
    # 阿里云则是 xxx.pem / xxx.key,按实际文件名改。
    ssl_certificate     /etc/nginx/ssl/helloac.top/helloac.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/helloac.top/helloac.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # 封面走 base64 上传,单张 ≤5MB、编码后约 6.7MB;Nginx 默认 1MB 会直接 413
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    access_log /var/log/nginx/helloac.top.access.log;
    error_log  /var/log/nginx/helloac.top.error.log;

    # 用户上传的封面:交给 Node,但让浏览器长缓存
    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 可选:给写接口加口令(强烈建议,详情见 README.md「部署与运维 · 阶段 8」)----
    # 应用的 POST/PUT/DELETE /api/books 与 POST /api/upload 都没有鉴权,
    # 公网可访问后任何人删你的书、传垃圾图。启用方式:
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd admin
    # 然后取消下面整段注释(GET/HEAD 不受影响,浏览照常,增删改会弹账号密码框):
    #
    # location /api/ {
    #     limit_except GET HEAD {
    #         auth_basic           "My books 管理口令";
    #         auth_basic_user_file /etc/nginx/.htpasswd;
    #     }
    #     proxy_pass http://127.0.0.1:3002;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;
    # }

    # 其余全部反代给 Node
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/notes(拉 GitHub 心得)与 /api/img-proxy(拉外链封面)要回源外网,
        # 超时给短了前端会看到 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
