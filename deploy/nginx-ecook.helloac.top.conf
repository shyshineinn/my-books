# ============================================================
# ecook · ecook.helloac.top(小程序后端)
# 部署路径:/etc/nginx/conf.d/ecook.helloac.top.conf
# 反代目标:127.0.0.1:3001(PM2 进程名 ecook)
# 证书:云厂商免费证书,放到 /etc/nginx/ssl/ecook.helloac.top/
#
# 背景(2026-09-17 服务器实测):
#   这台机器上**原本没有任何 ecook 的 Nginx 配置**。唯一生效的是 Ubuntu 默认站点
#   (sites-enabled/default → root /home/ecook/website-books, server_name _),
#   也就是旧的静态读书页;443 从未监听,ecook 一直是被 http://IP:3001 直连访问的。
#   所以本文件是**新建**,不是"改造既有配置"。
#
# 装完必须做的三件事(缺一不可):
#   1) 让默认站点退出:sudo mv /etc/nginx/sites-enabled/default /root/
#   2) sudo nginx -t && sudo systemctl reload nginx
#   3) 微信公众平台 → request 合法域名加 https://ecook.helloac.top,并**重新发布小程序**
# ============================================================

# ---------- HTTP:只留 ACME 校验路径,其余 301 跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name ecook.helloac.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS:小程序后端 ----------
server {
    # Nginx 1.24:沿用 `listen 443 ssl http2;` 写法(1.25.1+ 才有 `http2 on;`)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ecook.helloac.top;

    # 免费证书是单域名,所以 443 只服务 ecook.helloac.top 本身
    # 腾讯云下载包通常为 域名_bundle.crt / 域名.key;换成实际文件名即可
    ssl_certificate     /etc/nginx/ssl/ecook.helloac.top/ecook.helloac.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/ecook.helloac.top/ecook.helloac.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ecook_ssl:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # 菜品 / banner 图上传上限 5MB,留余量 6MB(与 ecook 原设计一致)
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;

    # 暂不开 HSTS:若首次上线证书出问题,浏览器会硬性拒绝 HTTP 访问,排障更麻烦。
    # 稳定运行一段后再取消下面这行的注释:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/ecook.helloac.top.access.log;
    error_log  /var/log/nginx/ecook.helloac.top.error.log;

    # 全部转发给 ecook —— 接口与 /uploads 图片都由 Node 提供
    # (根路径不再放静态页:读书网站已由 my-books 独立承担)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
